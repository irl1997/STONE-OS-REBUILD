<style>
#simbar{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:99999;font:12px/1.4 Inter,system-ui,sans-serif;color:#ede9e3}
#simbar button{font:inherit;color:inherit;background:#1c1d1f;border:1px solid #5e6064;border-radius:6px;padding:6px 10px;cursor:pointer}
#simbar button:hover{border-color:#c88a3a}
#simbox{display:none;margin-bottom:6px;background:#141517ee;border:1px solid #2b2c2f;border-radius:8px;padding:12px;width:min(320px,calc(100vw - 32px));gap:8px;flex-direction:column}
#simbox.on{display:flex}
#simbox h4{margin:0;font:500 12px Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#c88a3a}
#simbox p{margin:0;color:#8e9095}
#simbox .row{display:flex;gap:6px;flex-wrap:wrap}
#simbox .sel{border-color:#c88a3a}
</style>
<div id="simbar"><div id="simbox">
  <h4>Simulación — nada de esto es medido</h4>
  <p>Biblioteca, pantalla, ajustes de Steam y descargas son inventados para mostrar la interfaz. No hay FPS ni telemetría reales.</p>
  <p>Conexión al televisor:</p>
  <div class="row"><button id="simAp">Adaptador pasivo (≈300 MHz)</button><button id="simAa">Adaptador activo DP 1.4 → HDMI 2.0</button></div>
  <p>Teclado: flechas, Enter = A, Esc = B.</p>
  <div class="row"><button id="simEnd" hidden>Terminar el juego en curso</button></div>
</div><button id="simBtn">Simulación</button></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const sync = () => { $('simAp').classList.toggle('sel', SimPanel.adapter === 'passive'); $('simAa').classList.toggle('sel', SimPanel.adapter === 'active'); $('simEnd').hidden = !SimPanel.running; };
  SimPanel.refresh = sync; sync();
  $('simBtn').onclick = () => { $('simbox').classList.toggle('on'); sync(); };
  const set = a => () => { SimPanel.adapter = a; sync(); window.__stoneEvent('display', {}); };
  $('simAp').onclick = set('passive'); $('simAa').onclick = set('active');
  $('simEnd').onclick = () => { const a = SimPanel.running; SimPanel.running = null; if (a) SimStoned.sim.steamExit(a); sync(); };
})();
</script>
<script>
/* QA: visible text that overlaps other text or leaves the 1920 × 1080 stage (window.__overlap()). */
window.__overlap = () => {
  const stage = document.getElementById('stage'), sb = stage.getBoundingClientRect(), k = sb.width / 1920;
  const shown = el => { for (let e = el; e && e !== document.body; e = e.parentElement) { const c = getComputedStyle(e); if (c.display === 'none' || c.visibility === 'hidden' || +c.opacity < 0.05) return false; } return true; };
  /* With a full-screen layer on (dialog, setup, power, quick menu), only it and the toast are in front */
  const top = ['#dlg.on', '#setup.on', '#power.on', '#quick.on'].map(q => document.querySelector(q)).find(Boolean);
  const boxes = [], w = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT, { acceptNode: n => !top || top.contains(n) || n.parentElement.closest('#toast,#hints') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  for (let n; (n = w.nextNode());) {
    if (!n.textContent.trim() || !shown(n.parentElement)) continue;
    const r = document.createRange(); r.selectNodeContents(n);
    /* what an overflow-clipping ancestor hides is not on screen */
    let clip = null;
    for (let e = n.parentElement; e && e !== stage; e = e.parentElement) { const c = getComputedStyle(e); if (c.overflow !== 'visible') { const q = e.getBoundingClientRect(); clip = clip ? { l: Math.max(clip.l, q.left), t: Math.max(clip.t, q.top), r: Math.min(clip.r, q.right), b: Math.min(clip.b, q.bottom) } : { l: q.left, t: q.top, r: q.right, b: q.bottom }; } }
    for (const b0 of r.getClientRects()) { const b = clip ? { left: Math.max(b0.left, clip.l), top: Math.max(b0.top, clip.t), width: Math.min(b0.right, clip.r) - Math.max(b0.left, clip.l), height: Math.min(b0.bottom, clip.b) - Math.max(b0.top, clip.t) } : b0;
      if (b.width > 1 && b.height > 1) boxes.push({ el: n.parentElement, t: n.textContent.trim().slice(0, 40), x: (b.left - sb.left) / k, y: (b.top - sb.top) / k, w: b.width / k, h: b.height / k }); }
  }
  const out = [], hit = [];
  boxes.forEach(b => { if (b.x < -1 || b.y < -1 || b.x + b.w > 1921 || b.y + b.h > 1081) out.push(`${b.t} @${Math.round(b.x)},${Math.round(b.y)} ${Math.round(b.w)}×${Math.round(b.h)}`); });
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    if (a.el === b.el || a.el.contains(b.el) || b.el.contains(a.el)) continue;
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 2 && oy > 2) hit.push(`«${a.t}» × «${b.t}» (${Math.round(ox)}×${Math.round(oy)})`);
  }
  return { texts: boxes.length, outside: out, overlaps: hit };
};
</script>
