name: Build image

# Builds the STONE OS (rebuild) bootc image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/stone-os-rebuild:<tags>   (tags from VERSION and the git ref, scripts/release-info.sh)
# F0-A: a name of its own and the dev channel, so no console that follows rc23 receives it.
# Every pushed image is signed keyless (D-26): cosign uses this workflow's GitHub OIDC identity through
# Sigstore, so no signing key or repository secret exists. Verify with docs/FIRMA.md.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "hardware/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_tests:
        description: The caller already ran CI on this commit
        type: boolean
        default: false
    outputs:
      image:
        description: Image repository (ghcr.io/<owner>/stone-os-rebuild)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}
      version:
        value: ${{ jobs.build.outputs.version }}
      channel:
        value: ${{ jobs.build.outputs.channel }}

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: CI gate
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push
    needs: [tests]
    if: always() && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing (Sigstore OIDC), D-26
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Release facts (VERSION, channel, tags)
        id: info
        run: scripts/release-info.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" | tee -a "$GITHUB_OUTPUT"

      - name: Image name and pinned base
        id: meta
        run: |
          set -euo pipefail
          source image/config/build.env
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          [[ "${BASE_DIGEST}" == sha256:* ]] || { echo "::error::BASE_DIGEST must be pinned in image/config/build.env"; exit 1; }
          skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://${BASE_IMAGE}@${BASE_DIGEST}" >/dev/null
          echo "base=${BASE_IMAGE}:${BASE_TAG}@${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Base: ${BASE_IMAGE}:${BASE_TAG}@${BASE_DIGEST}"

      - name: Build
        env:
          BASE: ${{ steps.meta.outputs.base }}
          RESOLVED_DIGEST: ${{ steps.meta.outputs.base_digest }}
          VERSION: ${{ steps.info.outputs.version }}
          CHANNEL: ${{ steps.info.outputs.channel }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          set -euo pipefail
          source image/config/build.env
          podman build --pull=newer \
            --build-arg "BASE_IMAGE=${BASE}" --build-arg "BASE_DIGEST=${RESOLVED_DIGEST}" \
            --build-arg "STONE_COMMIT=${GITHUB_SHA}" --build-arg "STONE_CHANNEL=${CHANNEL}" \
            --build-arg "STONE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}" \
            --label "io.artifacthub.package.prerelease=${PRERELEASE}" \
            --tag "localhost/${IMAGE_NAME}:build" --file image/Containerfile .
          podman run --rm --entrypoint cat "localhost/${IMAGE_NAME}:build" /usr/lib/stone-release | tee stone-release.txt
          podman run --rm --entrypoint cat "localhost/${IMAGE_NAME}:build" /usr/lib/stone/governor-contract.txt | tee governor-contract.txt

      - name: Archive the pinned GPU governor package (R-03)
        run: |
          set -euo pipefail
          source image/config/build.env
          mkdir -p governor-rpm
          podman run --rm -v "${PWD}/governor-rpm:/out:Z" registry.fedoraproject.org/fedora:44 bash -c \
            "dnf -y -q install dnf5-plugins && dnf -y -q copr enable ${GOVERNOR_COPR} \
             && dnf -y download --destdir /out cyan-skillfish-governor-smu-${GOVERNOR_VERSION}"
          cp governor-contract.txt governor-rpm/
          (cd governor-rpm && sha256sum ./*.rpm governor-contract.txt | tee governor-SHA256SUMS)

      - name: Rechunk (smaller updates on the console)
        run: |
          set -euo pipefail
          source image/config/build.env
          # Same podman (rootless) that built the image, as in ublue-os/image-template's ostree-rechunk
          graphroot="$(podman info --format '{{.Store.GraphRoot}}')"
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="localhost/${IMAGE_NAME}:build",target=/rpm-ostree \
            --mount=type=bind,src="${graphroot}",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree "localhost/${IMAGE_NAME}:build" \
            compose build-chunked-oci --max-layers 127 --format-version=2 --bootc --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/${IMAGE_NAME}:build"

      - name: Push to GitHub Container Registry
        id: push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.info.outputs.tags }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source image/config/build.env
          echo "${REGISTRY_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for tag in ${TAGS}; do
            podman push --digestfile=/tmp/digest "localhost/${IMAGE_NAME}:build" "${IMAGE}:${tag}"
          done
          digest="$(cat /tmp/digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### STONE OS (rebuild) image"
            echo "- Image: \`${IMAGE}@${digest}\`"
            echo "- Tags: \`${TAGS}\`"
            echo '```'; cat stone-release.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          cosign sign -y "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/\.github/workflows/build-image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "- Signature: keyless (Sigstore), verified against this workflow's identity" >> "$GITHUB_STEP_SUMMARY"

      - name: Build metadata
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          BASE: ${{ steps.meta.outputs.base }}
          TAGS: ${{ steps.info.outputs.tags }}
        run: |
          python3 - <<'PY'
          import json, os
          rel = dict(l.strip().split("=", 1) for l in open("stone-release.txt") if "=" in l)
          json.dump({"image": os.environ["IMAGE"], "digest": os.environ["DIGEST"], "base": os.environ["BASE"],
                     "tags": os.environ["TAGS"].split(), "commit": os.environ["GITHUB_SHA"],
                     "release": {k: v.strip('"') for k, v in rel.items()}}, open("build-metadata.json", "w"), indent=1)
          PY
          cat build-metadata.json

      - name: Upload build metadata
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-metadata
          path: build-metadata.json
          retention-days: 90

      - name: Upload governor package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governor-rpm
          path: governor-rpm/
          if-no-files-found: error
          retention-days: 90
