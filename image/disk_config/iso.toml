# STONE OS (rebuild) installer (Anaconda ISO built by bootc-image-builder).
# @IMAGE_REF@ is replaced by the build-installer workflow (or scripts/build-iso-local.sh) with
# the image the ISO installs, e.g. ghcr.io/<owner>/stone-os-rebuild:0.2.0-dev.1. After installing, the
# console follows that image's channel tag (@UPDATE_REF@) for atomic updates.
[customizations.installer.kickstart]
contents = """
%post --log=/root/stone-install.log
bootc switch --mutate-in-place --transport registry @UPDATE_REF@
# STONE install report (M21): what was installed and when, for STONE HEALTH and support
{ echo "STONE OS installed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "Image: @IMAGE_REF@ (updates: @UPDATE_REF@)";
  cat /usr/lib/stone-release 2>/dev/null; lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS 2>/dev/null; } > /var/log/stone-install.txt || true
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
