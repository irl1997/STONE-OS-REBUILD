      lead: 'Elige por dónde suena la consola. Al elegir una salida suena una nota de prueba.',
      rows: [...(A ? A.outputs : []).map(o => ({ l: o.name, v: o.default ? 'en uso' : 'usar', k: 'out', o })),
        ...(A ? [{ l: 'Volumen', v: `${Math.round(A.volume * 100)} %`, k: 'vol', lr: true }] : [{ l: 'Salidas', v: 'leyendo…' }])],
      buttons: [['next', 'CONTINUAR']], onButton: suNext,
      onRow: async (r, k) => { if (r.k !== 'out') return; await Bridge.call('audio.default', r.o.id).catch(() => {}); A = await Bridge.call('audio.status').catch(() => A); draw(); setTimeout(() => play('notify'), 250); },
      onLR: (r, d, k) => { A.volume = Math.max(0, Math.min(1, Math.round((A.volume + d * 0.05) * 20) / 20)); Bridge.call('audio.volume', A.volume).catch(() => {}); play('nav'); draw(); } });
    draw();
    A = await Bridge.call('audio.status').catch(() => null);
    if (SU.cur.key === 'sonido') draw();
  },
  rend() {
    const c40 = S.caps && S.caps.board && S.caps.cu40, offer = c40 && c40.available && !c40.active && !SU.reboot;
    suDraw({ key: 'rend', title: 'RENDIMIENTO',
      lead: `STONE empieza en <b>${profOf(S.prof || 'balanced').n}</b>, los valores de fábrica. El primer encendido nunca sube frecuencias ni calibra: eso se hace cuando quieras en Ajustes → Rendimiento.`
        + (offer ? '<br><br>Tu GPU usa 24 de sus 40 unidades de cálculo. Con 40 rinde más, consume unos 30 W más y se calienta más. Es un cambio de la comunidad: si aparecen errores de GPU, STONE vuelve sola a 24 CU.' : ''),
      rows: [{ l: 'Perfil', v: profOf(S.prof || 'balanced').n }, { l: 'GPU', v: c40 ? (c40.active || SU.reboot ? '40 CU' + (SU.reboot ? ' al reiniciar' : '') : '24 CU') : '—' }],
      buttons: offer ? [['next', 'AHORA NO'], ['cu', 'ACTIVAR 40 CU']] : [['next', 'CONTINUAR']],   /* the safe answer has the focus */
      onButton: async b => {
        if (b !== 'cu') return suNext();
        toast('Cambiando el arranque…', false);
        const r = await Sys.cu40('enable').catch(e => ({ ok: false, text: e.message }));
        SU.reboot = !!(r && r.ok);
        toast(SU.reboot ? '40 CU se usará desde el próximo arranque' : 'No se pudo ahora: Ajustes → Rendimiento', false);
        SU_FN.rend();
      } });
  },
  steam() {
    const has = SU.fr.steam_account;
    suDraw({ key: 'steam', title: 'STEAM',
      lead: has ? 'Tu cuenta de Steam ya está en esta consola: tu biblioteca aparece en STONE.'
        : 'Tus juegos vienen de tu cuenta de Steam. Steam muestra su propia ventana de inicio de sesión: escanea su código QR con la app de Steam del móvil, o escribe con un teclado. STONE nunca ve tu contraseña y vuelve sola cuando termines.',
      rows: [{ l: 'Cuenta', v: has ? 'conectada' : 'sin iniciar sesión' }],
      buttons: has ? [['next', 'CONTINUAR']] : [['login', 'INICIAR SESIÓN'], ['next', 'MÁS TARDE']],
      /* the sign-in is Steam's own window (steamOpen); when it is done this step is drawn again (sfEnd) */
      onButton: b => { if (b === 'login') return steamOpen('login'); suNext(); } });
  },
  listo() {
    suDraw({ key: 'listo', title: 'TODO LISTO.', lead: 'Tu STONE MACHINE está preparada. Pulsa Y en Inicio para buscar un juego, y el botón STONE para volver aquí desde cualquier juego.',
      rows: [{ l: 'Encuadre', v: `${FRAME} %` }, { l: 'Rendimiento', v: profOf(S.prof || 'balanced').n + (SU.reboot ? ' · 40 CU al reiniciar' : '') },
        { l: 'Steam', v: SU.fr.steam_account ? 'conectado' : 'pendiente: Ajustes → Steam' }],
      buttons: [['go', 'EMPEZAR A JUGAR']], onButton: suFinish });
  }
};
async function firstRun(fr) {
  setTimeout(() => line.classList.remove('boot'), 1300);
  SU = { i: 0, fr, reboot: false, at: null };
  S.health = await Promise.race([Sys.health().catch(() => null), wait(5000).then(() => null)]);
  chrome(false, false); showScreen('');
  suEl().classList.add('on');
  suGo(0);
}
async function suFinish() {
  S.screen = 'transition';
  await Sys.firstrunComplete().catch(() => {});
  const el = $('#setup'); el.classList.add('out');
  await wait(700);
  el.classList.remove('on', 'out', 'framing');
  DLG = null; if (NAV) NAV.id = ''; NAV = null;
  enterHome({ r: 0, c: 0, slow: true });
  armIdleOff();
  if (SU.reboot) setTimeout(() => rebootDlg('40 CU se usará desde el próximo arranque.', () => enterHome({ r: 0, c: 0 })), 900);
}

/* ---------- Input dispatch ---------- */
function act(a) {
  /* Steam's own window is in front (D-34): the controller is Steam's; only the guide button is STONE's */
  if (S.steamFront) { if (a === 'home' && !S.steamFront.full) Sys.steamHide().catch(() => {}); return; }
  if (S.screen === 'transition') return;
  if (S.screen === 'store') { showHints(); return storeInput(a); }
  if (S.screen === 'spage') { showHints(); return storePageInput(a); }
  if (S.screen === 'game') {
    if (a === 'home' || a === 'menu') return openQuick();
    if (a === 'a') { play('select'); return resumeGame(); }
    if (a === 'b') { play('back'); return returnHome(); }
    return;
  }
  showHints();
  const dirs = ['up', 'down', 'left', 'right'];
  if (S.screen === 'quick') {
    if (a === 'b' || a === 'home') return closeQuick();
    if (a === 'left' || a === 'right') return quickLR(a);
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return quickA(focusEl());
    return;
  }
  if (S.screen === 'power') {
    if (a === 'b') return closePower();
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return powerA(focusEl());
    return;
  }
  if (S.screen === 'dlg') {
    if ((a === 'left' || a === 'right') && DLG.onLR && DLG.onLR(a === 'left' ? -1 : 1, focusEl())) return;
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return DLG.onA(focusEl());
    if (a === 'b' && DLG.onB) return DLG.onB();
    return;
  }
  if (S.screen === 'perf') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return perfA(focusEl());
    if (a === 'b') { play('back'); cat = CATS.indexOf('Rendimiento'); return enterSettings({ pane: true, ri: 0 }); }
    if (a === 'home') { if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); }
    return;
  }
  if (S.screen === 'tuning') {
    if (a === 'up' || a === 'down') return move(a);
    if (a === 'left' || a === 'right') return tuningLR(a === 'left' ? -1 : 1);
    if (a === 'a') return tuningA(focusEl());
    if (a === 'b') { play('back'); return enterPerf({ r: 0, c: 3 }); }
    return;
  }
  if (S.screen === 'settings') {
    if (dirs.includes(a)) return settingsMove(a);
    if (a === 'a') return settingsA(focusEl());
    if (a === 'b') { play('back'); $('#safe').classList.remove('on'); if (NAV.pane) return enterSettings(); if (NAV) NAV.id = ''; return enterHome({ sys: 'settings' }); }
    if (a === 'home') return enterHome({ r: 0, c: 0 });
    return;
  }
  if (S.screen === 'home') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return homeA(focusEl());
    if (a === 'lb' || a === 'rb') return section(a === 'lb' ? -1 : 1);
    if (a === 'y') { play('select'); return openSearch(); }
    if (a === 'b') { if (S.section !== 0) { play('back'); S.section = 0; if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); } return; }
    if (a === 'home') { if (NAV.r !== 0 || NAV.c !== 0) { play('nav'); NAV.r = 0; NAV.c = 0; applyFocus(); } return; }
    return;
  }
  if (S.screen === 'library') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return libraryA(focusEl());
    if (a === 'lb' || a === 'rb') return section(a === 'lb' ? -1 : 1);
    if (a === 'b' || a === 'home') { play('back'); S.section = 0; if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); }
    if (a === 'lt' || a === 'rt') return letterJump(a === 'lt' ? -1 : 1);
    if (a === 'y') { play('select'); return openSearch(); }
    return;
  }
  if (S.screen === 'detail') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return detailA(focusEl());
    if (a === 'b') { play('back'); return S.from === 'library' ? enterLibrary({ r: libRowOf(curG), c: libColOf(curG) }) : enterHome({ r: 0, c: Math.max(0, recent.indexOf(curG)) }); }
    if (a === 'home') { play('back'); S.section = 0; if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); }
  }
}
function libRowOf(i) { const k = libList().findIndex(g => g.i === i); return k < 0 ? 1 : 1 + Math.floor(k / 6); }
function libColOf(i) { const k = libList().findIndex(g => g.i === i); return k < 0 ? 0 : k % 6; }
function letterJump(d) {
  if (NAV.r === 0) return;
  const list = libList(), k = (NAV.r - 1) * 6 + NAV.c, cur = list[k].n[0];
  let j = k; do { j += d; } while (j >= 0 && j < list.length && list[j].n[0] === cur);
  if (j < 0 || j >= list.length) return bump(d);
  NAV.r = 1 + Math.floor(j / 6); NAV.c = j % 6; play('nav'); applyFocus(); toast(list[j].n[0].toUpperCase(), false);
}

/* Directional hold: one step, 400 ms pause, then 8 steps/s, 16 steps/s after 2 s */
const hold = { dir: null, t0: 0, next: 0 };
function startHold(dir) { hold.dir = dir; hold.t0 = performance.now(); hold.next = hold.t0 + 400; act(dir); ensureLoop(); }
function stopHold(dir) { if (!dir || hold.dir === dir) hold.dir = null; }
function holdTick(now) {
  if (hold.dir && now >= hold.next) { act(hold.dir); hold.next = now + (now - hold.t0 > 2000 ? 62 : 125); }
}

const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'a', ' ': 'a', Escape: 'b', Backspace: 'b', q: 'lb', Q: 'lb', e: 'rb', E: 'rb', h: 'home', H: 'home', Home: 'home', y: 'y', Y: 'y', z: 'lt', Z: 'lt', x: 'rt', X: 'rt', Tab: 'menu' };
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#bar')) return;
  const a = KEYS[e.key]; if (!a) return;
  e.preventDefault(); touched();
  if (e.repeat) return;
  if (['up', 'down', 'left', 'right'].includes(a)) startHold(a); else act(a);
});
window.addEventListener('keyup', e => { const a = KEYS[e.key]; if (a) stopHold(a); });
window.addEventListener('blur', () => stopHold());

/* ---------- Asleep while a game is in front ----------
   STONE stays open behind the game. While a game runs and STONE's window is not the focused one
   (Gamescope gives focus to the game), STONE draws nothing and reads no controller: animations
   and transitions are paused, the controller loop stops, the interface sound is suspended and
   live readings are unsubscribed. Chromium then produces no frames at all, so the GPU and CPU
   are the game's. Focus back (game closed, or STONE chosen from Steam) wakes it at once. */
function dormantCheck() {
  const on = S.running !== null && S.running !== undefined && !document.hasFocus();
  if (!!S.dormant === on) return;
  S.dormant = on;
  document.body.classList.toggle('dormant', on);
  console.info(`[stone] ${on ? 'asleep: game in front' : 'awake'}`);
  if (on) {
    /* the game is in front: its loading screen and label are done, and nothing may change the page now */
    loadingOff(); clearTimeout(tagT); $('#game .tag').classList.add('gone');
    if (loopH) { cancelAnimationFrame(loopH); clearTimeout(loopH); loopH = 0; }
    stopHold();
    audioSleep();
    if (telCtx) { telCtx = null; PerfAPI.unsubscribe().catch(() => {}); }
  } else {
    pollPads(); ensureLoop(); telemetrySync();
  }
}
window.addEventListener('blur', dormantCheck);
window.addEventListener('focus', dormantCheck);

/* One line in home.log at start: the resolution STONE is drawn at and the GPU drawing it
   ("SwiftShader" or "llvmpipe" would mean no GPU). */
(function drawProbe() {
  try {
    const c = document.createElement('canvas'), gl = c.getContext('webgl');
    const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
    const gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : (gl ? 'webgl' : 'none');
    console.info(`[stone] draw: ${Math.round(innerWidth * devicePixelRatio)}x${Math.round(innerHeight * devicePixelRatio)} dpr=${devicePixelRatio} gpu=${gpu}`);
    const lose = gl && gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    /* The window can still change size once after start (Gamescope, full screen): say so too. */
    let rt = 0;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() =>
      console.info(`[stone] draw: ${Math.round(innerWidth * devicePixelRatio)}x${Math.round(innerHeight * devicePixelRatio)} dpr=${devicePixelRatio} (resized)`), 500); });
  } catch (e) { console.warn('[stone] draw: ' + e); }
})();
/* Gamepad (standard mapping) */
const GP_BTN = { 0: 'a', 1: 'b', 3: 'y', 4: 'lb', 5: 'rb', 6: 'lt', 7: 'rt', 9: 'menu', 16: 'home', 8: 'home' };
let gpPrev = {}, gpDir = null, padOn = false;
function pollPads() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  const on = pads.length > 0;
  if (on !== padOn) { padOn = on; document.querySelector('#status .pad').classList.toggle('on', on); if (S.screen !== 'off') toast(on ? 'Mando conectado' : 'Mando desconectado', on); }
  const p = pads[0]; if (!p) return;
  for (const [i, a] of Object.entries(GP_BTN)) {
    const pr = p.buttons[i] && p.buttons[i].pressed;
    if (pr && !gpPrev[i]) { touched(); audio(); act(a); }
    gpPrev[i] = pr;
  }
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = i => p.buttons[i] && p.buttons[i].pressed;
  let dir = null;
  if (b(12) || ay < -.6) dir = 'up'; else if (b(13) || ay > .6) dir = 'down'; else if (b(14) || ax < -.6) dir = 'left'; else if (b(15) || ax > .6) dir = 'right';
  if (dir !== gpDir) { if (dir) touched(); if (gpDir) stopHold(gpDir); if (dir) startHold(dir); gpDir = dir; }
}
/* The loop exists only while a gamepad is connected or a direction is held. Rate by state:
   menus every frame; game, off and transitions 20 Hz; deep idle (60 s without input) 15 Hz. */
let loopH = 0, idleT = 0;
function inputRate() {
  if (S.screen === 'quick' || S.screen === 'dlg') return 'raf';
  if (S.screen === 'game') return 16;   /* game: no rAF, but the Home button keeps frame-level latency */
  if (S.screen === 'off' || S.screen === 'transition') return 50;
  return S.deep ? 66 : 'raf';
}
function ensureLoop() {
  if (loopH || S.dormant) return;
  const r = inputRate();
  loopH = r === 'raf' ? requestAnimationFrame(tickInput) : setTimeout(tickInput, r);
}
function tickInput() { loopH = 0; pollPads(); holdTick(performance.now()); if (padOn || hold.dir) ensureLoop(); }
function touched() {
  armIdleOff();
  if (S.deep) { S.deep = false; if (AC && AC.state !== 'running' && S.screen !== 'game') AC.resume(); }
  clearTimeout(idleT);
  idleT = setTimeout(() => { S.deep = true; if (S.screen !== 'game' && S.screen !== 'quick') audioSleep(); }, 60000);
}
window.addEventListener('gamepadconnected', () => { pollPads(); ensureLoop(); });
window.addEventListener('gamepaddisconnected', () => { pollPads(); });

/* Pointer: click focuses and activates, as the same focus model */
stage.addEventListener('click', e => {
  stage.focus({ preventScroll: true }); touched();
  const el = e.target.closest('[data-f]');
  if (!el || !NAV) return;
  if (S.screen === 'settings') {
    if (el.dataset.cat !== undefined) { cat = +el.dataset.cat; play('nav'); return enterSettings(); }
    if (el.classList.contains('srow')) { const ri = +el.dataset.row; if (!NAV.pane || NAV.c !== ri) { play('nav'); return enterSettings({ pane: true, ri }); } return settingsA(el); }
  }
  for (let r = 0; r < NAV.rows.length; r++) {
    const c = NAV.rows[r].indexOf(el);
    if (c >= 0) {
      if (NAV.r === r && NAV.c === c) return act('a');
      NAV.r = r; NAV.c = c; play('nav'); return applyFocus();
    }
  }
});

/* ---------- Self-test (stone-home --selftest, CI and first check on the board) ---------- */
async function selfTest() {
  const r = { pass: false, checks: {} }, c = r.checks;
  const t = async (k, f) => { try { c[k] = await f(); } catch (e) { c[k] = 'error: ' + (e.code || e.message); } };
  await t('state', async () => { const st = await PerfAPI.getState(); return !!st && typeof st.profile === 'string'; });
  await t('capabilities', async () => { const cp = await PerfAPI.getCapabilities(); return { board: cp.board, governor: cp.governor, advanced: cp.advanced }; });
  await t('library', async () => (await Sys.library()).games.length);
  await t('prefs', async () => typeof (await Sys.prefsGet()).sound === 'boolean');
  await t('info', async () => !!(await Sys.info()).release);
  c.audio = !!(window.AudioContext || window.webkitAudioContext);
  c.gamepad_api = typeof navigator.getGamepads === 'function';
  await (document.fonts ? document.fonts.load('300 20px Jost') : Promise.resolve());
  c.font = document.fonts ? document.fonts.check('300 20px Jost') : false;
  /* the size the page is drawn at, once the window has settled (the shell checks it at 4K) */
  await new Promise(res => setTimeout(res, 1500));
  c.draw = `${Math.round(innerWidth * devicePixelRatio)}x${Math.round(innerHeight * devicePixelRatio)}`;
  r.pass = c.state === true && c.prefs === true && typeof c.library === 'number' && c.info === true && c.font === true;
  await Bridge.call('selftest', r);
}

/* ---------- Start ---------- */
applyPrefs();
const ready = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
ready.then(() => {
  stage.focus({ preventScroll: true });
  touched(); pollPads(); if (padOn) ensureLoop();
  if (location.hash === '#selftest') return selfTest();
  audio(); boot();
});
})();
</script>
