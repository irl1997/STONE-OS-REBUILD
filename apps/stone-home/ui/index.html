<title>STONE</title>
<style>
@font-face{font-family:Jost;font-style:normal;font-weight:200;font-display:block;src:url(fonts/jost-latin-200-normal.woff2) format("woff2")}
@font-face{font-family:Jost;font-style:normal;font-weight:300;font-display:block;src:url(fonts/jost-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:block;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:block;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Jost;font-style:normal;font-weight:400;font-display:block;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:block;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}

</head><body>
<style>
/* Layout: a fixed 1920×1080 console stage, scaled to fit the screen. Single dark look by design. */
:root{
  --void:#0a0a0b; --basalt:#141517; --graphite:#1c1d1f; --shale:#2b2c2f; --slate:#5e6064;
  --ash:#8e9095; --warm:#ede9e3; --light:#ffffff; --ember:#c88a3a; --error:#d0675c;
  --text-2:var(--ash); --horizon:var(--shale); --line-w:2px; --scrim:.55;
  --f-display:Jost,Futura,"Century Gothic",sans-serif;
  --f-text:Inter,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono","JetBrains Mono",monospace;
  --d-step:220ms; --d-settle:360ms; --d-exit:450ms; --d-enter:600ms; --d-light:900ms; --d-cer:1200ms;
  --e-step:cubic-bezier(.25,.1,0,1); --e-settle:cubic-bezier(.2,0,0,1); --e-light:cubic-bezier(.4,0,.2,1);
  --e-exit:cubic-bezier(.4,0,1,1); --e-cer:cubic-bezier(.45,0,.15,1);
  --fscale:1.06; --ts:1;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--warm)}
body{font-family:var(--f-text);overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--void);
  font-family:var(--f-text);user-select:none;-webkit-user-select:none;outline:none}

/* Theme modifiers inside the stage */
#stage.hc{--text-2:var(--warm);--horizon:var(--ash);--line-w:4px;--scrim:.78}

/* Backgrounds */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity var(--d-light) var(--e-light)}
.bg.on{opacity:1}
#veil{position:absolute;inset:0;pointer-events:none;transition:opacity var(--d-light) var(--e-light);
  background:linear-gradient(to bottom,rgba(10,10,11,calc(var(--scrim) - .2)) 0%,rgba(10,10,11,var(--scrim)) 48%,rgba(10,10,11,.97) 64%,var(--void) 72%)}
#veil.side{background:linear-gradient(to right,rgba(10,10,11,.92) 0%,rgba(10,10,11,.78) 42%,rgba(10,10,11,.15) 72%,rgba(10,10,11,0) 100%),linear-gradient(to top,rgba(10,10,11,.9) 0%,rgba(10,10,11,0) 30%)}
#veil.none{opacity:0}

/* Shared chrome */
.brand{font-family:var(--f-display);font-weight:200;letter-spacing:.45em;color:var(--warm)}
#hdr{position:absolute;left:96px;right:96px;top:54px;height:48px;display:flex;justify-content:space-between;align-items:center;transition:opacity var(--d-enter) var(--e-light)}
#hdr .brand{font-size:32px}
#status{display:flex;gap:28px;align-items:center;font-size:20px;color:var(--text-2);font-variant-numeric:tabular-nums}
#status svg{stroke:var(--text-2)}
#status .pad.on svg{stroke:var(--warm)}
#safeBadge{font-size:15px;letter-spacing:.18em;color:var(--warm);border:1px solid var(--warm);border-radius:3px;padding:2px 8px}
#tabs{position:absolute;left:96px;top:140px;display:flex;gap:56px;font-family:var(--f-display);font-weight:300;font-size:22px;letter-spacing:.22em;transition:opacity var(--d-enter) var(--e-light)}
#tabs span{color:var(--text-2);transition:color var(--d-step) var(--e-step)}
#tabs span.cur{color:var(--warm)}
.hide{opacity:0!important;pointer-events:none}

.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity var(--d-enter) var(--e-light),visibility 0s linear var(--d-enter),transform var(--d-enter) var(--e-settle)}
.screen.on{opacity:1;visibility:visible;transition:opacity var(--d-enter) var(--e-light),visibility 0s,transform var(--d-enter) var(--e-settle)}
.screen.zoom{transform:scale(.985)}
.screen.on.zoom{transform:none}

/* Focus line: one per stage */
#line{position:absolute;left:0;top:0;width:1920px;height:var(--line-w);background:var(--light);border-radius:2px;z-index:61;pointer-events:none;
  transform-origin:0 50%;transform:translate(960px,886px) scaleX(0);
  transition:transform var(--d-step) var(--e-step),opacity var(--d-step) linear,translate 160ms var(--e-settle)}
#line.slow{transition:transform var(--d-cer) var(--e-cer),opacity var(--d-enter) linear,translate 160ms var(--e-settle)}
#line.off{opacity:0}
#line.load::after{content:"";position:absolute;top:0;left:0;height:100%;width:30%;background:var(--void);opacity:.55;animation:load 1.6s var(--e-light) infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

/* Focusables */
[data-f]{cursor:pointer}
.txt-f{color:var(--text-2);transition:color var(--d-step) var(--e-step)}
.txt-f.f{color:var(--warm)}

/* HOME */
#home .clip{position:absolute;left:0;top:0;width:1920px;height:680px;overflow:hidden}
#home .track{position:absolute;left:96px;top:0;height:680px;display:flex;gap:24px;align-items:flex-end;padding-bottom:26px;box-sizing:border-box;transition:transform var(--d-step) var(--e-step)}
.card{flex:none;border-radius:4px;background-color:var(--shale);background-size:cover;background-position:center;transform-origin:0 100%;transition:transform var(--d-settle) var(--e-settle),translate var(--d-settle) var(--e-settle);position:relative}
.card.f{transform:scale(var(--fscale))}
.card.hero{width:678px;height:382px}
.card.cap{width:200px;height:300px}
.card.tile{width:200px;height:300px;background:var(--graphite);display:flex;align-items:flex-end;padding:20px;box-sizing:border-box;font-family:var(--f-display);font-weight:300;letter-spacing:.2em;font-size:16px;color:var(--text-2)}
.card.wide{width:400px;height:225px;background:var(--graphite);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:24px;box-sizing:border-box}
.card.wide b{font-family:var(--f-display);font-weight:300;letter-spacing:.2em;font-size:20px;color:var(--warm)}
.card.wide span{font-size:18px;color:var(--text-2)}
.card.dim{opacity:.4}
.card .run{position:absolute;left:24px;top:24px;font-family:var(--f-display);font-weight:300;letter-spacing:.3em;font-size:16px;color:var(--ember)}
#home .horizon{position:absolute;left:96px;top:669px;width:1728px;height:1px;background:var(--horizon)}
#home .ctx{position:absolute;left:96px;top:706px;display:flex;flex-direction:column;gap:8px;max-width:1300px}
.kicker{font-family:var(--f-display);font-weight:300;font-size:20px;letter-spacing:.3em;color:var(--text-2)}
.kicker .now{color:var(--ember)}
.ctx-title{font-family:var(--f-display);font-weight:300;font-size:calc(40px * var(--ts));line-height:1.2;letter-spacing:.3em;color:var(--warm);text-transform:uppercase}
.meta{font-size:calc(20px * var(--ts));color:var(--text-2);opacity:0;transition:opacity var(--d-light) var(--e-light);font-variant-numeric:tabular-nums}
.meta.on{opacity:1}
#home .sys{position:absolute;left:96px;top:930px;display:flex;gap:64px;font-size:22px}
#home .sys span{display:flex;gap:12px;align-items:center}
#home .sys svg{stroke:currentColor}

/* LIBRARY */
#library .filters{position:absolute;left:96px;top:206px;display:flex;gap:40px;font-size:22px}
#library .filters span.cur{color:var(--warm)}
#library .filters span.cur::after{content:"";display:block;height:2px;background:var(--slate);margin-top:8px}
#library .count{position:absolute;right:96px;top:210px;font-size:20px;color:var(--text-2)}
#library .gclip{position:absolute;left:0;top:276px;width:1920px;height:680px;overflow:hidden}
#library .grid{position:absolute;left:96px;top:4px;width:1728px;transition:transform var(--d-step) var(--e-step)}
#library .grid .card{position:absolute;width:254.67px;height:381px}
#library .empty{position:absolute;left:96px;top:300px;font-size:24px;color:var(--text-2)}
#library .sel{position:absolute;left:96px;top:994px;font-size:20px;color:var(--text-2);max-width:1100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* DETAIL */
/* Anchored above JUGAR and growing upwards, so a long name never runs into it (board, RC5). */
#detail .col{position:absolute;left:96px;bottom:540px;width:1000px;display:flex;flex-direction:column;gap:16px}
#detail .origin{font-size:20px;color:var(--text-2);letter-spacing:.1em}
#detail h1{margin:0;font-family:var(--f-display);font-weight:300;font-size:64px;line-height:72px;letter-spacing:.3em;color:var(--warm);text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
#detail h1.long{font-size:48px;line-height:56px;letter-spacing:.22em}
#detail .stats{font-size:calc(24px * var(--ts));line-height:1.4;color:var(--text-2);font-variant-numeric:tabular-nums}
#detail .primary{position:absolute;left:96px;top:560px;font-family:var(--f-display);font-weight:300;font-size:40px;line-height:48px;letter-spacing:.3em;color:var(--warm)}
#detail .second{position:absolute;left:96px;top:690px;display:flex;gap:64px;font-size:22px}
#detail .info{position:absolute;left:96px;right:96px;top:860px;border-top:1px solid var(--horizon);padding-top:24px;display:flex;gap:72px;font-size:20px;color:var(--text-2)}
#detail .info div{display:flex;flex-direction:column;gap:4px}
#detail .info b{font-weight:400;color:var(--warm)}

/* GAME */
#game .art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
#game .tag{position:absolute;left:96px;bottom:64px;font-size:20px;color:var(--warm);opacity:.85;transition:opacity 1.2s var(--e-light);text-shadow:0 1px 8px rgba(0,0,0,.6)}
#game .tag.gone{opacity:0}
body.dormant *,body.dormant *::before,body.dormant *::after{animation-play-state:paused!important;transition:none!important}
#metrics{position:absolute;left:40px;top:32px;font-family:var(--f-mono);font-size:20px;line-height:30px;color:var(--warm);background:rgba(10,10,11,.72);padding:12px 18px;border-radius:4px;z-index:30;font-variant-numeric:tabular-nums;white-space:pre}

/* QUICK MENU */
#quick{position:absolute;inset:0;z-index:20;visibility:hidden;transition:visibility 0s linear var(--d-enter)}
#quick.on{visibility:visible;transition:visibility 0s}
#quick .dim{position:absolute;inset:0;background:var(--void);opacity:0;transition:opacity var(--d-enter) var(--e-light)}
#quick.on .dim{opacity:.45}
#quick .panel{position:absolute;right:0;top:0;width:560px;height:1080px;background:var(--basalt);box-sizing:border-box;padding:54px 56px;display:flex;flex-direction:column;gap:30px;transform:translateX(100%);transition:transform var(--d-enter) var(--e-settle)}
#quick.on .panel{transform:none}
#quick .top{display:flex;justify-content:space-between;align-items:center}
#quick .top .brand{font-size:24px}
#quick .top span:last-child{font-size:20px;color:var(--text-2)}
#quick .main{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.18em}
#quick .it{font-size:24px}
#quick .seg{display:flex;flex-direction:column;gap:14px}
#quick .seg .lbl{font-size:20px}
#quick .opts{display:flex;gap:8px}
#quick .opts span{flex:1;text-align:center;padding:12px 0;border:1px solid var(--shale);border-radius:4px;font-size:20px;color:var(--text-2)}
#quick .opts span.cur{border-color:var(--ash);color:var(--warm)}
#quick .rule{height:1px;background:var(--shale)}
#quick .steam{display:flex;flex-direction:column;gap:18px}
#quick .steam .cap{font-size:16px;letter-spacing:.12em;color:var(--slate)}
#quick .steam .it{font-size:22px}
#quick .tog{color:var(--slate)}

/* SETTINGS */
#settings{background:var(--basalt)}
#settings .ttl{position:absolute;left:96px;top:140px;font-family:var(--f-display);font-weight:300;font-size:40px;letter-spacing:.3em}
#settings .cats{position:absolute;left:96px;top:236px;width:480px;display:flex;flex-direction:column;gap:20px;font-size:24px}
#settings .cats span.cur{color:var(--warm)}
#settings .vr{position:absolute;left:640px;top:236px;width:1px;height:700px;background:var(--shale)}
#settings .pane{position:absolute;left:704px;top:236px;width:1120px;display:flex;flex-direction:column;gap:28px}
#settings .desc{font-size:24px;line-height:34px;color:var(--text-2)}
/* Long lists (Emuladores) scroll inside the pane, above the button hints. */
#settings .rows{display:flex;flex-direction:column;position:relative;max-height:600px;overflow:hidden}
.srow{display:flex;justify-content:space-between;align-items:center;gap:32px;padding:22px 0;border-bottom:1px solid var(--shale)}
.srow:last-child{border-bottom:none}
.srow .l{display:flex;flex-direction:column;gap:6px}
.srow .l b{font-weight:400;font-size:calc(24px * var(--ts));color:var(--text-2);transition:color var(--d-step) var(--e-step)}
.srow.f .l b{color:var(--warm)}
.srow .l small{font-size:calc(20px * var(--ts));color:var(--text-2)}
.srow .v{font-size:20px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.srow.f .v{color:var(--warm)}
.srow .v .ar{color:var(--slate);padding:0 10px}
#safe{position:absolute;inset:0;pointer-events:none;z-index:35;opacity:0;transition:opacity var(--d-step) linear}
#safe.on{opacity:1}
#safe i{position:absolute;width:48px;height:48px;border-color:var(--ember);border-style:solid;border-width:0}

/* POWER */
#power{position:absolute;inset:0;z-index:25;visibility:hidden;transition:visibility 0s linear var(--d-enter)}
#power.on{visibility:visible;transition:visibility 0s}
#power .dim{position:absolute;inset:0;background:var(--void);opacity:0;transition:opacity var(--d-enter) var(--e-light)}
#power.on .dim{opacity:.72}
#power .box{position:absolute;left:660px;top:290px;width:600px;background:var(--basalt);border-radius:4px;box-sizing:border-box;padding:56px 64px;display:flex;flex-direction:column;gap:30px;opacity:0;transform:translateY(16px);transition:opacity var(--d-enter) var(--e-light),transform var(--d-enter) var(--e-settle)}
#power.on .box{opacity:1;transform:none}
#power .h{font-family:var(--f-display);font-weight:300;font-size:24px;letter-spacing:.3em;color:var(--text-2)}
#power .main{font-family:var(--f-display);font-weight:300;font-size:36px;letter-spacing:.3em}
#power .warn{font-size:20px;line-height:28px;color:var(--ember)}

/* PERFORMANCE CENTER */
#perf,#tuning{background:var(--basalt)}
.pttl{position:absolute;left:96px;top:140px;font-family:var(--f-display);font-weight:300;font-size:40px;letter-spacing:.3em}
.pstatus{position:absolute;left:96px;top:208px;font-size:20px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pstatus b{font-weight:400;color:var(--warm)}
.pread{position:absolute;left:96px;top:242px;font-size:17px;color:var(--text-3, var(--text-2));font-variant-numeric:tabular-nums;opacity:.8}
#perf .prow{position:absolute;left:96px;top:290px;display:flex;gap:24px}
.card.ptile{width:414px;height:270px;box-sizing:border-box;padding:28px;background:var(--graphite);display:flex;flex-direction:column;gap:10px}
.ptile .pn{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.22em;color:var(--warm)}
.ptile .pd{font-size:20px;line-height:28px;color:var(--text-2)}
.ptile .ps{margin-top:auto;font-size:18px;line-height:26px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ptile .pa{font-family:var(--f-display);font-weight:300;font-size:16px;letter-spacing:.3em;color:var(--ember);min-height:20px}
#perf .acts{position:absolute;left:96px;top:676px;display:flex;gap:64px;font-size:24px}
#perf .note{position:absolute;left:96px;top:770px;max-width:1150px;font-size:20px;line-height:30px;color:var(--text-2)}
#tuning .tclip{position:absolute;left:96px;top:250px;width:1000px;height:710px;overflow:hidden}
#tuning .trows{position:absolute;left:0;top:0;width:1000px;display:flex;flex-direction:column;transition:transform var(--d-step) var(--e-step)}
#tuning .side{position:absolute;left:1180px;top:262px;width:644px;display:flex;flex-direction:column;gap:20px}
.pbox{background:var(--graphite);border-radius:4px;padding:26px 32px;display:flex;flex-direction:column;gap:12px}
.pbox h3{margin:0 0 4px;font-family:var(--f-display);font-weight:300;font-size:18px;letter-spacing:.3em;color:var(--text-2)}
.kv{display:flex;justify-content:space-between;gap:24px;font-size:20px;color:var(--text-2);font-variant-numeric:tabular-nums}
.kv b{font-weight:400;color:var(--warm)}
.kv b.chg{color:var(--ember)}
.srow .v.ro{color:var(--slate)}
#dlg{position:absolute;inset:0;z-index:27;visibility:hidden}
#dlg.on{visibility:visible}
#dlg .dim{position:absolute;inset:0;background:var(--void);opacity:.85}
#dlg.solid .dim{opacity:1}
#dlg .box{position:absolute;left:520px;top:200px;width:880px;box-sizing:border-box;background:var(--basalt);border-radius:4px;padding:56px 64px;display:flex;flex-direction:column;gap:26px}
#dlg.solid .box{background:transparent;top:300px}
#dlg h2{margin:0;font-family:var(--f-display);font-weight:300;font-size:32px;letter-spacing:.3em;color:var(--warm)}
#dlg p{margin:0;font-size:22px;line-height:32px;color:var(--text-2)}
#dlg .btns{display:flex;gap:64px;font-family:var(--f-display);font-weight:300;font-size:26px;letter-spacing:.22em;margin-top:8px}
#dlg .live{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
#dlg .live div{display:flex;flex-direction:column;gap:6px;font-size:18px;color:var(--text-2)}
#dlg .live b{font-family:var(--f-mono);font-weight:400;font-size:28px;color:var(--warm);font-variant-numeric:tabular-nums}
#dlg .ptrack{height:2px;background:var(--shale);margin-top:8px}
#dlg .res{font-family:var(--f-display);font-weight:300;font-size:36px;letter-spacing:.3em;color:var(--warm)}
#dlg .kvs{display:flex;flex-direction:column;gap:10px}

/* BOOT / OFF */
#black{position:absolute;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity var(--d-enter) var(--e-light)}
#black.on{opacity:1}
#black.fast{transition-duration:var(--d-exit)}
#bootword{position:absolute;left:0;right:0;top:430px;text-align:center;font-size:64px;padding-left:.45em;z-index:60;opacity:0;transition:opacity var(--d-enter) var(--e-light)}
#bootword.on{opacity:1}
#offmsg{position:absolute;left:0;right:0;top:960px;text-align:center;font-size:20px;color:var(--slate);z-index:60;opacity:0;transition:opacity var(--d-light) var(--e-light)}
#offmsg.on{opacity:1}
#bootword,#offmsg,#toast,#hints{pointer-events:none}

/* HINTS / TOAST */
#hints{position:absolute;right:96px;top:994px;display:flex;gap:40px;font-size:20px;color:var(--text-2);transition:opacity var(--d-light) var(--e-light);z-index:22}
#hints div{display:flex;gap:8px;align-items:center}
.g{display:inline-flex;min-width:30px;height:30px;padding:0 6px;border:2px solid var(--text-2);border-radius:15px;align-items:center;justify-content:center;font-size:14px;font-weight:500;box-sizing:border-box;color:var(--text-2)}
#toast{position:absolute;left:96px;top:996px;font-size:20px;color:var(--warm);z-index:45;opacity:0;transform:translateY(8px);transition:opacity var(--d-enter) var(--e-light),transform var(--d-enter) var(--e-settle);max-width:1000px}
#toast.on{opacity:1;transform:none}
#pulse{position:absolute;left:0;bottom:0;width:1920px;height:2px;background:var(--light);opacity:0;z-index:46;pointer-events:none}
#pulse.go{animation:pulse 1.4s var(--e-light)}
@keyframes pulse{0%{opacity:0;transform:scaleX(.2)}25%{opacity:.9;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}

/* ---------- ESTRATOS (D-30) ----------
   The screen as rock seen in section: a header stratum, the game stratum (its art shows through),
   an amber vein for the horizon and a deep stratum with the machine's state. Labels read like core
   samples: mono, numbered strata. Loaded after every other rule: it restyles, it never removes. */
#stage{--vein:#c88a3a;--vein-deep:#7a4f20;--st-head:rgba(18,19,21,.93);--st-deep:rgba(13,14,15,.96);--st-rule:#26272a}
.st-head{position:absolute;left:0;top:0;width:1920px;height:196px;background:var(--st-head);border-bottom:1px solid var(--st-rule);pointer-events:none}
.st-deep{position:absolute;left:0;top:672px;width:1920px;height:408px;background:var(--st-deep);pointer-events:none}
.st-label{position:absolute;left:96px;font-family:var(--f-mono);font-size:15px;letter-spacing:.16em;color:var(--text-2);text-transform:uppercase;font-variant-numeric:tabular-nums}
.st-label b{font-weight:400;color:var(--warm)}
#home .horizon{top:668px;height:3px;background:linear-gradient(90deg,transparent 0%,var(--vein) 12%,var(--vein-deep) 62%,transparent 100%);opacity:1;box-shadow:0 0 18px rgba(200,138,58,.35)}
#home .ctx{top:700px}
#home .strata{position:absolute;left:96px;top:872px;width:1728px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px}
#home .strata div{display:flex;flex-direction:column;gap:8px;min-width:0}
#home .strata span{font-family:var(--f-mono);font-size:14px;letter-spacing:.16em;color:var(--text-2)}
#home .strata b{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.1em;color:var(--warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .strata b.warn{color:var(--ember)}
#home .sys{top:984px;gap:56px;font-family:var(--f-display);font-weight:300;letter-spacing:.14em;font-size:20px}
#home .st-label.l2{top:836px}
#home .st-label.l1{top:226px}
#hdr .brand{letter-spacing:.55em}
#tabs{gap:64px;font-size:20px;letter-spacing:.28em}
#stage.hc{--st-rule:var(--ash)}
/* Library: the same header stratum; the count reads like a sample label */
#library::before{content:"";position:absolute;left:0;top:0;width:1920px;height:196px;background:var(--st-head);border-bottom:1px solid var(--st-rule)}
#library .count{font-family:var(--f-mono);font-size:15px;letter-spacing:.16em;text-transform:uppercase;top:214px}
#library .count::before{content:"ESTRATO 01 · ";color:var(--text-2)}
#library .filters span.cur::after{background:var(--vein)}
/* Settings: the header stratum over the title; the categories are the core's labels (mono, numbered
   by order), the vein marks the open one. */
#settings::before{content:"";position:absolute;left:0;top:0;width:1920px;height:208px;background:#121315;border-bottom:1px solid var(--st-rule)}
#settings{background:linear-gradient(180deg,#141517 0%,#101113 100%)}
#settings .cats{counter-reset:cat;gap:18px;font-family:var(--f-mono);font-size:19px;letter-spacing:.08em}
#settings .cats span{counter-increment:cat}
#settings .cats span::before{content:counter(cat,decimal-leading-zero) "  ";color:var(--slate)}
#settings .cats span.cur::before{color:var(--vein)}
#settings .vr{background:linear-gradient(180deg,var(--vein) 0%,var(--vein-deep) 40%,var(--st-rule) 100%);width:2px;opacity:.7}
/* Quick menu and power: deep-stratum panels with the vein on their edge */
#quick .panel{background:var(--st-deep);border-left:2px solid var(--vein)}
#quick .steam .cap{font-family:var(--f-mono);font-size:14px;letter-spacing:.16em}
#power .box{background:#121315;border-top:2px solid var(--vein);border-radius:2px}
#power .h{font-family:var(--f-mono);font-size:16px;letter-spacing:.2em}
#dlg .box{border-top:2px solid var(--vein)}
#dlg.solid .box{border-top:0}
/* Game page: the info strip is the deep stratum, its labels are samples; the vein under the actions */
#detail::after{content:"";position:absolute;left:0;top:842px;width:1920px;height:238px;background:var(--st-deep);pointer-events:none}
#detail .info{z-index:1;border-top:3px solid transparent;border-image:linear-gradient(90deg,var(--vein) 0%,var(--vein-deep) 50%,transparent 100%) 1;font-family:var(--f-mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase}
#detail .info b{font-family:var(--f-text);font-size:22px;letter-spacing:0;text-transform:none}
#detail .origin{font-family:var(--f-mono);font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--vein)}
/* Performance and tuning: strata background, profile tiles with a top vein of their own colour */
#perf,#tuning{background:linear-gradient(180deg,#141517 0%,#141517 196px,#101113 196px,#0e0f10 100%)}
#perf::before,#tuning::before{content:"";position:absolute;left:0;top:195px;width:1920px;height:1px;background:var(--st-rule)}
.card.ptile{background:#0e0f10;border-top:3px solid var(--slate);border-radius:2px}
.card.ptile.cur{border-top-color:var(--vein)}
#perf .note{font-family:var(--f-text)}
/* Game screen (a game is open): its label reads like a sample */
#game .tag{font-family:var(--f-mono);font-size:17px;letter-spacing:.12em}
/* FIRST RUN and full-screen dialogs: a stratum card on black */
#dlg.solid .box{background:#121315;border-top:3px solid var(--vein);border-radius:2px;top:220px}
#dlg.solid .brand{letter-spacing:.55em}
/* On-screen keyboard (connect.js osk) */
#dlg .krow{display:flex;gap:10px;justify-content:center}
#dlg .key{min-width:56px;padding:10px 0;text-align:center;font-family:var(--f-mono);font-size:24px;background:#0e0f10;border-radius:2px}
#dlg .key.wide{min-width:120px;font-size:16px;letter-spacing:.14em}
#dlg .okbox{font-family:var(--f-mono);font-size:28px;color:var(--warm);border-bottom:2px solid var(--vein);padding-bottom:8px;min-height:40px;word-break:break-all}
/* Search results (home.js searchResults) */
#dlg .slist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:hidden}
#dlg .sres{display:flex;justify-content:space-between;gap:24px;font-size:22px;padding:6px 0}
#dlg .sres small{font-family:var(--f-mono);font-size:15px;letter-spacing:.08em;color:var(--text-2)}
#dlg .st-cap{font-family:var(--f-mono);font-size:14px;letter-spacing:.16em;color:var(--vein);margin-top:10px}
/* GAME LOADING (detail_game.js loadingOn): the game's art slowly settles, its name on the deep stratum
   and the vein running under it until the game is in front. Flex column: lines never overlap. */
#game .tag{bottom:auto;top:72px}
#game.loading .art{opacity:.62;animation:ld-settle 20s var(--e-light) both}
@keyframes ld-settle{from{transform:scale(1.07)}to{transform:scale(1)}}
#game .ld{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s var(--e-light),visibility 0s linear .9s;
  background:linear-gradient(90deg,rgba(10,10,11,.94) 0%,rgba(10,10,11,.72) 42%,rgba(10,10,11,.12) 100%),linear-gradient(0deg,rgba(10,10,11,.92) 0%,rgba(10,10,11,0) 50%)}
#game.loading .ld{opacity:1;visibility:visible;transition:opacity .6s var(--e-light)}
#game .ld .col{position:absolute;left:96px;bottom:150px;width:1240px;display:flex;flex-direction:column;gap:20px}
#game .ld-kick{font-family:var(--f-mono);font-size:16px;letter-spacing:.2em;color:var(--vein);text-transform:uppercase}
#game .ld-title{font-family:var(--f-display);font-weight:300;font-size:72px;line-height:84px;letter-spacing:.24em;color:var(--warm);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#game .ld-title.long{font-size:52px;line-height:62px;letter-spacing:.18em}
#game .ld-sub{font-size:22px;line-height:30px;color:var(--text-2)}
#game .ld-sub:empty,#game .ld-note:empty{display:none}
#game .ld-bar{position:relative;width:640px;height:4px;margin-top:18px;background:rgba(237,233,227,.18);border-radius:2px;overflow:hidden}
#game .ld-bar i{position:absolute;left:0;top:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--vein) 50%,transparent);animation:ld-sweep 1.8s ease-in-out infinite;box-shadow:0 0 14px rgba(200,138,58,.5)}
@keyframes ld-sweep{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#game .ld-step{font-family:var(--f-mono);font-size:18px;letter-spacing:.24em;color:var(--warm)}
#game .ld-note{font-size:20px;line-height:28px;color:var(--text-2);max-width:900px}
#game .ld-foot{position:absolute;right:96px;bottom:64px;display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:300;font-size:18px;letter-spacing:.22em;color:var(--text-2)}
#stage.rm #game.loading .art,#stage.rm #game .ld-bar i{animation:none}
/* Lists inside dialogs (GRÁFICOS, PROPIEDADES, STEAM PREGUNTA): label left, value right, one per line */
#dlg .sres small{white-space:nowrap}
#dlg .box > .st-cap{margin:0 0 -14px}
/* SETUP (power_boot.js): the first start, full screen. Left: the step; right: the core sample of the
   whole setup, one stratum per step, the vein on the current one. Columns and rows are flex/grid:
   text wraps inside its column and never reaches the core. */
#setup{position:absolute;inset:0;z-index:26;background:linear-gradient(180deg,#121315 0%,#121315 196px,#0e0f10 196px,#0b0b0c 100%);opacity:0;visibility:hidden;transition:opacity .8s var(--e-light),visibility 0s linear .8s}
#setup.on{opacity:1;visibility:visible;transition:opacity .8s var(--e-light)}
#setup.out{opacity:0}
#setup .su-head{position:absolute;left:96px;right:96px;top:54px;height:48px;display:flex;justify-content:space-between;align-items:center}
#setup .su-head .brand{font-size:32px;letter-spacing:.55em}
#setup .su-count{font-family:var(--f-mono);font-size:16px;letter-spacing:.2em;color:var(--text-2)}
#setup::before{content:"";position:absolute;left:0;top:195px;width:1920px;height:1px;background:var(--st-rule)}
#setup .su-body{position:absolute;left:96px;top:250px;width:1000px;max-height:790px;display:flex;flex-direction:column;gap:22px}
#setup .su-body.in{animation:su-in .7s var(--e-settle) both}
@keyframes su-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#setup .su-kick{font-family:var(--f-mono);font-size:16px;letter-spacing:.2em;color:var(--text-2)}
#setup .su-kick b{font-weight:400;color:var(--vein)}
#setup .su-title{margin:0;font-family:var(--f-display);font-weight:200;font-size:88px;line-height:96px;letter-spacing:.2em;color:var(--warm)}
#setup .su-lead{margin:0;font-size:26px;line-height:38px;color:var(--text-2);max-width:940px}
#setup .su-lead b{font-weight:400;color:var(--warm)}
#setup .su-rows{display:flex;flex-direction:column;margin-top:14px;border-top:1px solid var(--st-rule)}
#setup .su-row{display:flex;justify-content:space-between;align-items:baseline;gap:32px;padding:16px 0;border-bottom:1px solid var(--st-rule);font-size:24px;color:var(--warm)}
#setup .su-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#setup .su-row b{flex:none;font-family:var(--f-mono);font-weight:400;font-size:18px;letter-spacing:.12em;color:var(--text-2);text-transform:uppercase}
#setup .su-row.txt-f b{color:var(--vein)}
#setup .su-row.lr b{color:var(--warm)}
#setup .su-btns{margin-top:36px;display:flex;gap:72px;font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.24em;color:var(--warm)}
#setup .su-core{position:absolute;left:1340px;top:250px;width:484px;display:grid;grid-template-rows:repeat(8,1fr);height:740px;border-left:2px solid var(--st-rule)}
#setup .su-core div{display:flex;align-items:center;gap:24px;padding-left:36px;font-family:var(--f-mono);font-size:17px;letter-spacing:.2em;color:var(--slate);border-bottom:1px solid #1b1c1e;
  background:linear-gradient(90deg,rgba(43,44,47,.25),transparent 70%);transition:color .6s var(--e-light),background .6s var(--e-light)}
#setup .su-core div:nth-child(odd){background:linear-gradient(90deg,rgba(43,44,47,.4),transparent 70%)}
#setup .su-core span{color:inherit;opacity:.7}
#setup .su-core .done{color:var(--text-2)}
#setup .su-core .cur{color:var(--warm);margin-left:-2px;border-left:3px solid var(--vein);background:linear-gradient(90deg,rgba(200,138,58,.22),transparent 80%);box-shadow:-6px 0 18px rgba(200,138,58,.35)}
/* Framing: amber corners at the stage edges, so the person sees where the picture ends on the TV */
#setup .su-frame{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#setup.framing .su-frame{opacity:1}
#setup .su-frame i{position:absolute;width:120px;height:120px;border:0 solid var(--vein)}
#setup .su-frame i:nth-child(1){left:0;top:0;border-left-width:6px;border-top-width:6px}
#setup .su-frame i:nth-child(2){right:0;top:0;border-right-width:6px;border-top-width:6px}
#setup .su-frame i:nth-child(3){left:0;bottom:0;border-left-width:6px;border-bottom-width:6px}
#setup .su-frame i:nth-child(4){right:0;bottom:0;border-right-width:6px;border-bottom-width:6px}
#stage.rm #setup .su-body.in{animation:none}
/* Screenshot viewer (home.js shotViewer): the picture fills the stage, caption and buttons on the deep stratum */
#dlg.viewer .box{left:0;top:0;width:1920px;height:1080px;padding:0;border:0;background:#000;gap:0}
#dlg.viewer .shot-img{position:absolute;inset:0 0 170px 0;background:center/contain no-repeat}
#dlg.viewer .shot-cap{position:absolute;left:96px;bottom:64px;display:flex;flex-direction:column;gap:6px;font-size:22px;color:var(--text-2)}
#dlg.viewer .shot-cap b{font-family:var(--f-display);font-weight:300;font-size:32px;letter-spacing:.2em;color:var(--warm)}
#dlg.viewer .btns{position:absolute;right:96px;bottom:118px;margin:0}   /* above the button hints */
.card.cap.shot{width:400px;height:225px;background-size:cover;background-position:center}   /* screenshots are 16:9 */
/* Settings: the pane ends above the button hints whatever the description's length; the rows take
   what is left and scroll inside it (the focus keeps the current row in view). */
#settings .pane{bottom:120px}
#settings .rows{flex:1 1 auto;min-height:0;max-height:none}
/* Home context: one line for the name (long names end in «…»), so the line under it never reaches stratum 02 */
#home .ctx-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1728px}
#home .ctx .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1728px}

/* ---- 3.0 ---- names on cards without artwork; a card with only the store's wide picture */
.card .nm{position:absolute;left:20px;right:20px;bottom:24px;font-family:var(--f-display);font-weight:300;letter-spacing:.2em;font-size:18px;line-height:1.3;color:var(--warm);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow-wrap:anywhere}
.card.hdr{background-size:100% auto;background-position:center 18%;background-repeat:no-repeat;background-color:#0e0f10}
.card.wide.vein{border-top:3px solid var(--vein)}
.card.wide.vein b{color:var(--vein)}
.card.hero.dim,.card.cap.dim{opacity:.6}
/* TIENDA: the same strata as the library; wide cards (Steam's store pictures), the name and the price under each */
#store::before{content:"";position:absolute;left:0;top:0;width:1920px;height:196px;background:var(--st-head);border-bottom:1px solid var(--st-rule)}
#store .filters{position:absolute;left:96px;top:206px;display:flex;gap:40px;font-size:22px}
#store .filters span{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#store .filters span.cur{color:var(--warm)}
#store .filters span.cur::after{content:"";display:block;height:2px;background:var(--vein);margin-top:8px}
#store .count{position:absolute;right:96px;top:214px;font-family:var(--f-mono);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
#store .count::before{content:"ESTRATO 01 · "}
#store .gclip{position:absolute;left:0;top:276px;width:1920px;height:680px;overflow:hidden}
#store .grid{position:absolute;left:96px;top:4px;width:1728px;transition:transform var(--d-step) var(--e-step)}
#store .scard{position:absolute;width:400px;height:187px;background-color:#0e0f10}
#store .scard .off{position:absolute;left:0;top:0;padding:6px 12px;background:var(--vein);color:#0a0a0b;font-family:var(--f-mono);font-size:16px;letter-spacing:.06em;border-radius:4px 0 4px 0}
#store .scard .cap2{position:absolute;left:0;right:0;top:calc(100% + 26px);display:flex;flex-direction:column;gap:4px}
#store .scard .cap2 b{font-weight:400;font-size:20px;line-height:26px;color:var(--warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#store .scard .cap2 i{font-style:normal;font-family:var(--f-mono);font-size:15px;line-height:20px;letter-spacing:.08em;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#store .scard .cap2 s{margin-right:12px;opacity:.7}
#store .empty{position:absolute;left:96px;top:300px;font-size:24px;color:var(--text-2);max-width:1400px}
#store .sel{position:absolute;left:96px;top:994px;font-size:20px;color:var(--text-2);max-width:900px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a game's page in the store reuses the game page; its description */
#detail .stats.about{font-size:calc(22px * var(--ts));line-height:1.45;max-width:900px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
#detail .stats.about:empty{display:none}
/* Steam's own window is coming in front (D-34) */
#sfront{position:absolute;inset:0;z-index:44;background:#0a0a0b;visibility:hidden;opacity:0;transition:opacity var(--d-enter) var(--e-light),visibility 0s linear var(--d-enter)}
#sfront.on{visibility:visible;opacity:1;transition:opacity var(--d-enter) var(--e-light),visibility 0s}
#sfront .sf-box{position:absolute;left:96px;top:300px;width:1100px;display:flex;flex-direction:column;gap:26px;border-top:3px solid var(--vein);padding-top:40px}
#sfront .st-cap{font-family:var(--f-mono);font-size:16px;letter-spacing:.2em;color:var(--vein)}
#sfront h2{margin:0;font-family:var(--f-display);font-weight:200;font-size:64px;line-height:76px;letter-spacing:.2em;color:var(--warm)}
#sfront p{margin:0;font-size:26px;line-height:38px;color:var(--text-2);max-width:940px}
#sfront .sf-foot{display:flex;gap:14px;align-items:center;font-size:22px;color:var(--warm);margin-top:14px}
#sfront .sf-foot .g{border-color:var(--vein);color:var(--vein);padding:0 12px}
/* the QR code for the phone */
#dlg .qrrow{display:flex;gap:40px;align-items:flex-start}
#dlg .qrrow .qr{flex:none;border-radius:4px}
#dlg .qrrow div{display:flex;flex-direction:column;gap:18px;min-width:0}
#dlg .qrrow .url{font-family:var(--f-mono);font-size:17px;line-height:24px;letter-spacing:.04em;color:var(--warm);word-break:break-all}
/* Messages have their own lane, top right under the clock: they never cover the bottom row
   (Home's system row, the library's and the store's selection line were under them before) */
#toast{left:auto;right:96px;top:136px;max-width:760px;text-align:right;line-height:28px;transform:translateY(-8px)}
/* Home with large text (Ajustes → Accesibilidad, up to 1.5×): the game's name and its line grow up to
   1.3× and the block starts higher, so its last line never reaches the label of stratum 02 */
#home .ctx{top:calc(700px - (var(--ts) - 1) * 36px);gap:6px}
#home .ctx-title{font-size:calc(40px * min(var(--ts), 1.3))}
#home .ctx .meta{font-size:calc(20px * min(var(--ts), 1.3))}
/* ---------- CRISTAL ----------
   The interface made of the STONE MACHINE's own materials: its glossy black body (panels of dark,
   blurred glass with the body's sharp reflection), the faceted stone band that wraps it (the section
   bar and the status), its white panel (what is chosen turns white) and the white light line on its
   front (under the chosen game, under the wordmark, in the boot and the loading bar).
   Type: the wordmark's own Jost and its light weights: titles and labels in thin, widely spaced capitals
   like the wordmark, text in regular. Behind them,
   the game's own art fills the screen; screens without art get the studio light of the console's
   portrait, tinted with the colour of the last game. Titles in sentence case; the STONE wordmark keeps its thin, wide Jost. Loaded after ESTRATOS: it restyles, it never removes. #stage.lite
   (Ajustes → Pantalla → Efectos de cristal: Ligeros, and always without GPU) draws it without blur. */
#stage{
  --accent:#f0a23b;
  --accent-glow:color-mix(in srgb,var(--accent) 55%,transparent);
  --accent-deep:color-mix(in srgb,var(--accent) 22%,#05060a);
  --plate:#f5f5f7; --ink:#0b0c10;
  --warm:#f5f5f7; --text-2:rgba(235,235,245,.72); --slate:rgba(235,235,245,.42); --shale:rgba(255,255,255,.14);
  --horizon:rgba(255,255,255,.14); --st-rule:rgba(255,255,255,.12); --vein:var(--accent); --ember:var(--accent);
  --glass-fill:linear-gradient(155deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.06) 55%,rgba(255,255,255,.09) 100%);
  --glass-edge:rgba(255,255,255,.22);
  --glass-shine:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.04);
  --glass-drop:0 22px 56px rgba(2,3,8,.42);
  --blur:blur(30px) saturate(185%);
  --r-card:20px; --r-panel:30px;
  --f-display:Jost,Futura,"Century Gothic",sans-serif;
  --aurora:radial-gradient(ellipse 70% 62% at 10% 6%,rgba(124,58,237,.58) 0%,rgba(124,58,237,0) 62%),
    radial-gradient(ellipse 62% 56% at 90% 16%,rgba(14,165,233,.46) 0%,rgba(14,165,233,0) 62%),
    radial-gradient(ellipse 78% 64% at 72% 104%,rgba(240,162,59,.34) 0%,rgba(240,162,59,0) 60%),
    radial-gradient(ellipse 56% 60% at 16% 98%,rgba(236,72,153,.30) 0%,rgba(236,72,153,0) 62%),
    linear-gradient(160deg,#100c26 0%,#0a1028 46%,#06070d 100%);
  background:#06070d;
}
#stage.hc{--text-2:#ffffff;--glass-edge:rgba(255,255,255,.6)}
/* the wordmark keeps its stone voice */
#stage .brand,#bootword{font-family:Jost,Futura,"Century Gothic",sans-serif}

/* ---- glass ---- */
#stage :is(#tabs,#status,.card.tile,.card.wide,.card.ptile,#home .strata>div,#quick .panel,#power .box,#dlg .box,
  #settings .cats,#settings .pane,.pbox,#toast,#sfront .sf-box,#detail .info){
  background:var(--glass-fill);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-edge);border-image:none;box-shadow:var(--glass-shine),var(--glass-drop)}
#stage.lite :is(#tabs,#status,.card.tile,.card.wide,.card.ptile,#home .strata>div,#quick .panel,#power .box,#dlg .box,
  #settings .cats,#settings .pane,.pbox,#toast,#sfront .sf-box,#detail .info){
  -webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(155deg,rgba(44,46,62,.94),rgba(22,24,34,.94))}

/* ---- backgrounds: the art shows, a soft shade only where text sits ---- */
#veil{background:linear-gradient(180deg,rgba(5,6,10,.5) 0%,rgba(5,6,10,0) 24%),linear-gradient(0deg,rgba(5,6,10,.88) 0%,rgba(5,6,10,.4) 38%,rgba(5,6,10,0) 62%)}
#veil.home{background:linear-gradient(180deg,rgba(5,6,10,.55) 0%,rgba(5,6,10,0) 22%),
  linear-gradient(90deg,rgba(5,6,10,.42) 0%,rgba(5,6,10,0) 40%),
  linear-gradient(0deg,var(--accent-deep) 0%,rgba(5,6,10,.78) 16%,rgba(5,6,10,.34) 42%,rgba(5,6,10,0) 64%)}
#veil.side{background:linear-gradient(90deg,rgba(5,6,10,.86) 0%,rgba(5,6,10,.55) 38%,rgba(5,6,10,0) 70%),
  linear-gradient(0deg,rgba(5,6,10,.82) 0%,rgba(5,6,10,0) 36%)}
.st-head{background:none;border-bottom:0}
.st-deep{background:none}
#home .horizon,#settings .vr{display:none}
#library::before,#store::before,#settings::before,#perf::before,#tuning::before,#setup::before,#detail::after{display:none}
#settings,#perf,#tuning,#setup{background:var(--aurora)}

/* ---- header: wordmark, the sections as a glass pill, the status capsule ---- */
#hdr{top:42px;height:60px}
#hdr .brand{font-size:30px;letter-spacing:.5em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
#status{padding:12px 22px;border-radius:999px;gap:22px;color:var(--warm)}
#status svg{stroke:var(--warm)}
#tabs{left:50%;top:42px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;
  font-family:var(--f-text);font-weight:400;font-size:19px;letter-spacing:.01em}
#tabs span{padding:12px 26px;border-radius:999px;color:var(--text-2);transition:background var(--d-step) var(--e-step),color var(--d-step) var(--e-step)}
#tabs span.cur{background:var(--plate);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* ---- focus: the line is the boot's; everything else lifts or turns into a white pill ---- */
#line{opacity:0}
#line.boot{opacity:1;box-shadow:0 0 22px rgba(255,255,255,.55)}
#stage [data-f]:not(.card):not(.srow):not(.key):not(.primary){padding:8px 18px;margin:-8px -18px;border-radius:14px;
  transition:background var(--d-step) var(--e-step),color var(--d-step) var(--e-step),box-shadow var(--d-step) var(--e-step)}
#stage [data-f].f:not(.card):not(.srow):not(.key):not(.primary){background:var(--plate);color:var(--ink);
  box-shadow:0 10px 28px rgba(0,0,0,.32),0 0 26px var(--accent-glow)}
#stage [data-f].f:not(.card):not(.srow) :is(small,b,i,span,svg){color:inherit}
#stage [data-f].f:not(.card):not(.srow) svg{stroke:currentColor}
#home .sys [data-f],#library .filters [data-f],#store .filters [data-f],#detail .second [data-f],#dlg .btns [data-f]{border-radius:999px}
#library .filters span.cur::after,#store .filters span.cur::after{display:none}
#library .filters span.cur:not(.f),#store .filters span.cur:not(.f){color:var(--warm);background:rgba(255,255,255,.14)}

/* cards: rounded, a glass sheen, and a white ring with the game's glow when chosen */
#stage .card{border-radius:var(--r-card);background-color:rgba(255,255,255,.08);
  transition:transform var(--d-settle) var(--e-settle),translate var(--d-settle) var(--e-settle),box-shadow var(--d-settle) var(--e-settle)}
#stage .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 34%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#stage .card.f{box-shadow:0 0 0 4px rgba(255,255,255,.96),0 0 44px 8px var(--accent-glow),0 28px 64px rgba(0,0,0,.55);z-index:2}
#stage .card.f::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
#stage .card.dim{opacity:.62}
#stage .card.hero.dim,#stage .card.cap.dim{opacity:.72}
.card .nm{font-family:var(--f-text);font-weight:400;letter-spacing:.01em;font-size:22px;line-height:1.2;
  text-shadow:0 2px 12px rgba(0,0,0,.55);-webkit-line-clamp:3}
.card .run{font-family:var(--f-text);font-weight:400;font-size:14px;letter-spacing:.1em;color:var(--ink);background:var(--plate);
  padding:6px 12px;border-radius:999px}
#stage .card.tile{font-family:var(--f-text);font-weight:400;font-size:20px;letter-spacing:.01em;color:var(--warm);padding:22px}
#stage .card.wide{padding:26px}
#stage .card.wide b{font-family:var(--f-text);font-weight:400;font-size:24px;letter-spacing:.01em}
#stage .card.wide span{color:var(--text-2)}
#stage .card.wide.vein{border-top:1px solid var(--glass-edge);background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 34%,transparent),rgba(255,255,255,.06))}
#stage .card.wide.vein b{color:var(--warm)}

/* ---- section labels and text ---- */
.st-label{font-family:var(--f-text);font-weight:400;font-size:19px;letter-spacing:.01em;text-transform:none;color:var(--text-2)}
.st-label b{font-weight:400;font-size:26px;color:var(--warm);margin-right:6px}
#home .st-label.l1{top:212px}
.kicker{font-family:var(--f-text);font-weight:400;font-size:16px;letter-spacing:.12em;color:var(--text-2)}
.kicker .now{color:var(--accent)}
.ctx-title{font-family:var(--f-text);font-weight:400;letter-spacing:.01em;text-transform:none;font-size:calc(46px * min(var(--ts),1.3))}
#home .ctx{gap:8px}

/* the machine: four glass widgets */
#home .st-label.l2{top:840px}
#home .strata{top:878px;gap:20px}
#home .strata>div{padding:16px 22px;border-radius:22px;gap:6px}
#home .strata span{font-family:var(--f-text);font-weight:400;font-size:13px;letter-spacing:.12em;color:var(--text-2)}
#home .strata b{font-family:var(--f-text);font-weight:400;font-size:26px;letter-spacing:.01em}
#home .strata b.warn{color:#ffd60a}
#home .sys{top:990px;gap:48px;font-family:var(--f-text);font-weight:400;letter-spacing:.01em;font-size:19px}

/* ---- library and store ---- */
#library .count,#store .count{font-family:var(--f-text);font-weight:400;font-size:17px;letter-spacing:.02em;text-transform:none}
#library .count::before,#store .count::before{content:none}
#library .filters,#store .filters{font-weight:400}
#store .scard .off{background:#30d158;color:#03200d;font-family:var(--f-text);font-weight:400;border-radius:var(--r-card) 0 14px 0}
#store .scard .cap2 b{font-weight:400}
#store .scard .cap2 i{font-family:var(--f-text);font-weight:400;letter-spacing:.01em}
#store .scard .cap2 s{opacity:.55}

/* ---- a game's page (also the store's): bold title, white primary pill, glass facts ---- */
#detail .origin{font-family:var(--f-text);font-weight:400;font-size:15px;letter-spacing:.14em;color:var(--accent);text-shadow:0 1px 10px rgba(0,0,0,.4)}
#detail h1{font-family:var(--f-text);font-weight:400;font-size:76px;line-height:84px;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.4)}
#detail h1.long{font-size:56px;line-height:64px;letter-spacing:.01em}
#detail .stats{color:rgba(245,245,247,.82)}
#detail .primary{top:552px;padding:16px 46px;border-radius:999px;font-family:var(--f-text);font-weight:400;font-size:28px;line-height:36px;
  letter-spacing:.06em;color:var(--warm);background:rgba(255,255,255,.16);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-shine);
  transition:background var(--d-step) var(--e-step),color var(--d-step) var(--e-step),transform var(--d-settle) var(--e-settle),box-shadow var(--d-step) var(--e-step)}
#detail .primary.f{background:var(--plate);color:var(--ink);transform:scale(1.04);box-shadow:0 14px 36px rgba(0,0,0,.4),0 0 40px var(--accent-glow)}
#stage.lite #detail .primary{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(44,46,62,.9)}
#detail .second{top:688px;gap:44px;font-weight:400}
#detail .second [data-f]:not(.f){background:rgba(255,255,255,.1)}
#detail .info{top:846px;left:96px;right:96px;padding:22px 32px;border-radius:24px;gap:56px;font-family:var(--f-text);font-weight:400;
  font-size:13px;letter-spacing:.12em}
#detail .info b{font-weight:400;font-size:22px;letter-spacing:.01em;color:var(--warm)}

/* ---- settings, performance ---- */
#settings .ttl,.pttl{font-family:var(--f-text);font-weight:400;font-size:46px;letter-spacing:.01em;top:132px}
#settings .cats{left:72px;top:216px;width:512px;box-sizing:border-box;padding:26px 26px;border-radius:var(--r-panel);gap:6px;
  font-family:var(--f-text);font-weight:400;font-size:19px;letter-spacing:.005em}
#settings .cats span::before{font-family:var(--f-mono);font-weight:400;font-size:15px}
#settings .cats span.cur:not(.f){color:var(--warm);background:rgba(255,255,255,.14)}
#settings .cats span.cur::before{color:var(--accent)}
#settings .cats span.f::before{color:rgba(11,12,16,.5)}
#settings .pane{left:612px;top:216px;width:auto;right:72px;bottom:112px;box-sizing:border-box;padding:30px 40px;border-radius:var(--r-panel)}
#settings .desc{color:rgba(245,245,247,.8)}
.srow{border-bottom:1px solid rgba(255,255,255,.1);padding:20px 22px;margin:0 -22px;border-radius:16px;
  transition:background var(--d-step) var(--e-step)}
.srow .l b{font-weight:400}
.srow.f{background:var(--plate);border-bottom-color:transparent;box-shadow:0 10px 28px rgba(0,0,0,.28),0 0 24px var(--accent-glow)}
.srow.f .l b,.srow.f .v{color:var(--ink)}
.srow.f .l small{color:rgba(11,12,16,.66)}
.srow.f .v .ar{color:rgba(11,12,16,.45)}
.card.ptile{border-radius:var(--r-card);border-top:1px solid var(--glass-edge)}
.card.ptile.cur{background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 36%,transparent),rgba(255,255,255,.06))}
.ptile .pn{font-family:var(--f-text);font-weight:400;letter-spacing:.04em}
.ptile .pa{font-family:var(--f-text);font-weight:400;letter-spacing:.12em}
.pbox{border-radius:24px}
.pbox h3{font-family:var(--f-text);font-weight:400;letter-spacing:.12em}

/* ---- quick menu, power, dialogs, messages ---- */
#quick .panel{right:24px;top:24px;height:1032px;border-radius:34px;transform:translateX(calc(100% + 32px));border-left:1px solid var(--glass-edge)}
#quick.on .panel{transform:none}
#quick.on .dim{opacity:.3}
#quick .main{font-family:var(--f-text);font-weight:400;letter-spacing:.02em}
#quick .opts span{border-radius:999px}
#quick .opts span.cur{background:var(--plate);color:var(--ink);border-color:transparent}
#power.on .dim,#dlg .dim{opacity:.5}
#power .box{border-radius:var(--r-panel);border-top:1px solid var(--glass-edge)}
#power .main{font-family:var(--f-text);font-weight:400;letter-spacing:.06em}
#power .h{font-family:var(--f-text);font-weight:400;letter-spacing:.14em}
#dlg .box{border-radius:var(--r-panel);border-top:1px solid var(--glass-edge)}
#dlg.solid .dim{opacity:1;background:var(--aurora)}
#dlg.solid .box{border-top:1px solid var(--glass-edge);border-radius:var(--r-panel)}
#dlg h2{font-family:var(--f-text);font-weight:400;letter-spacing:.04em}
#dlg .btns{font-family:var(--f-text);font-weight:400;font-size:22px;letter-spacing:.08em;gap:20px}
#dlg .btns [data-f]:not(.f){background:rgba(255,255,255,.1)}
#dlg .st-cap{font-family:var(--f-text);font-weight:400;letter-spacing:.14em;color:var(--accent)}
#dlg .sres small{font-family:var(--f-text);font-weight:400;letter-spacing:.01em}
#dlg .key{background:rgba(255,255,255,.12);border-radius:12px;transition:background var(--d-step) var(--e-step),color var(--d-step) var(--e-step)}
#dlg .key.f{background:var(--plate);color:var(--ink);box-shadow:0 0 22px var(--accent-glow)}
#dlg .okbox{border-bottom-color:var(--accent)}
#stage #dlg.viewer .box{background:#000;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;border-radius:0;box-shadow:none}
#toast{padding:12px 22px;border-radius:22px;font-weight:400}
.g{border-width:1.5px;border-color:rgba(255,255,255,.7);color:var(--warm);background:rgba(255,255,255,.12);font-weight:400}
#hints{color:var(--warm);font-weight:400}
#safe i{border-color:var(--accent)}

/* ---- loading a game, Steam in front, first start ---- */
#game.loading .art{opacity:.92}
#game .ld{background:linear-gradient(90deg,rgba(5,6,10,.82) 0%,rgba(5,6,10,.48) 40%,rgba(5,6,10,0) 75%),linear-gradient(0deg,rgba(5,6,10,.85) 0%,rgba(5,6,10,0) 48%)}
#game .ld-kick{font-family:var(--f-text);font-weight:400;letter-spacing:.14em;color:var(--accent)}
#game .ld-title{font-family:var(--f-text);font-weight:400;letter-spacing:.01em;font-size:84px;line-height:92px}
#game .ld-title.long{font-size:60px;line-height:68px;letter-spacing:.01em}
#game .ld-step{font-family:var(--f-text);font-weight:400;letter-spacing:.16em}
#game .ld-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
#game .ld-bar i{background:linear-gradient(90deg,transparent,var(--plate) 40%,var(--accent) 60%,transparent)}
#game .tag{font-family:var(--f-text);font-weight:400;letter-spacing:.02em}
#sfront{background:var(--aurora)}
#sfront .sf-box{padding:44px 52px;border-radius:var(--r-panel);border-top:1px solid var(--glass-edge)}
#sfront h2{font-family:var(--f-text);font-weight:400;letter-spacing:.02em}
#sfront .st-cap{font-family:var(--f-text);font-weight:400;color:var(--accent)}
#setup .su-title{font-family:var(--f-text);font-weight:400;letter-spacing:.01em;font-size:84px;line-height:92px}
#setup .su-kick,#setup .su-count{font-family:var(--f-text);font-weight:400;letter-spacing:.12em}
#setup .su-kick b{color:var(--accent)}
#setup .su-btns{font-family:var(--f-text);font-weight:400;letter-spacing:.08em;gap:28px}
#setup .su-btns [data-f]:not(.f){background:rgba(255,255,255,.12)}
#setup .su-row{border-bottom-color:rgba(255,255,255,.12)}
/* the grids start 26 px higher inside their clip, so the chosen card's lift and ring are never cut */
#library .gclip,#store .gclip{top:250px;height:706px}
#library .grid,#store .grid{top:30px}
/* the rows' list clips its overflow: it gets the room the chosen row's plate needs on each side */
#settings .rows{padding:0 22px;margin:0 -22px}
#settings .cats{font-size:20px}
/* FIRST RUN: the steps on a glass card; the current one a white pill; titles in sentence case */
#setup .su-core{border-left:0;padding:14px;gap:6px;border-radius:var(--r-panel);background:var(--glass-fill);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shine),var(--glass-drop);box-sizing:border-box}
#stage.lite #setup .su-core{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(155deg,rgba(44,46,62,.94),rgba(22,24,34,.94))}
#setup .su-core div{border-bottom:0;border-radius:18px;padding-left:24px;font-family:var(--f-text);font-weight:400;font-size:19px;letter-spacing:.02em;color:var(--text-2)}
#setup .su-core div:nth-child(odd){background:none}
#setup .su-core span{font-family:var(--f-mono);font-weight:400;font-size:15px}
#setup .su-core .done{color:var(--warm)}
#setup .su-core .done span{color:var(--accent);opacity:1}
#setup .su-core div.cur{margin-left:0;border-left:0;background:var(--plate);color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.3),0 0 26px var(--accent-glow)}
#setup .su-title{text-transform:lowercase}
#setup .su-title::first-letter{text-transform:uppercase}
#game .art{opacity:.55}

/* ---- SELLO STONE MACHINE: the console's materials (they override the values above) ---- */
#stage{

/* CRISTAL: the colour of the game in focus, read from its own art (a 24 × 14 copy, colourful and

/* EXPERIENCE ENGINE · Thermal Forecast (experience.py thermal_forecast, same rule): least squares over
   the last 5 minutes of stoned's GPU temperature; minutes to the profile's limit at this pace. */
const THERM = [];
function thermPush(m) {
  if (!m || m.gpu_temp_c == null) return;
  const t = Date.now() / 1000; THERM.push([t, m.gpu_temp_c]);
  while (THERM.length && t - THERM[0][0] > 300) THERM.shift();
}
function thermalForecast(limit) {
  if (!limit || THERM.length < 6 || THERM[THERM.length - 1][0] - THERM[0][0] < 60) return null;
  const n = THERM.length, mt = THERM.reduce((a, p) => a + p[0], 0) / n, mc = THERM.reduce((a, p) => a + p[1], 0) / n;
  const v = THERM.reduce((a, p) => a + (p[0] - mt) ** 2, 0); if (!v) return null;
  const slope = THERM.reduce((a, p) => a + (p[0] - mt) * (p[1] - mc), 0) / v * 60;
  if (slope < 0.2) return null;
  const now = mc + slope / 60 * (THERM[n - 1][0] - mt);
  return Math.max(0, (limit - now) / slope);
}

/* ---------- STEAM ASKS, STONE ANSWERS ----------
   Steam sometimes stops to ask (saves in the cloud that do not match, which way to start a game,
   a licence, a first-launch question). Its interface is hidden in the STONE session, so STONE reads
   the question (steamcef.dialog) and asks it with its own screen; the answer presses Steam's button.
   Watched while a game starts, installs or uninstalls. [VERIFICAR EN PLACA] */
let swT = 0, swUntil = 0, swBusy = false, swSkip = { key: '', until: 0 };
function steamWatch(ms) {
  swUntil = Math.max(swUntil, Date.now() + ms);
  if (!swT) swT = setTimeout(swTick, 1200);
}
async function swTick() {
  swT = 0;
  if (Date.now() > swUntil) return;
  if (!swBusy && !S.dormant && !['dlg', 'power', 'quick'].includes(S.screen)) {
    swBusy = true;
    const r = await Sys.steamDialog().catch(() => null);
    swBusy = false;
    const d = r && r.dialog, key = d ? d.title + '|' + d.buttons.join('|') : '';
    if (d && !S.dormant && !(key === swSkip.key && Date.now() < swSkip.until) && !['dlg', 'power', 'quick'].includes(S.screen)) steamAsk(d, key);
  }
  swT = setTimeout(swTick, 2500);
}
function steamAsk(d, key) {
  const from = S.screen, nav = NAV;
  const back = () => {
    closeDlg();
    if (from === 'game') { S.screen = 'game'; NAV = null; line.classList.add('off'); $('#hints').classList.add('hide'); return; }
    if (from === 'detail') return enterDetail(curG, { r: 0, c: 0 });
    if (from === 'library') return enterLibrary();
    if (from === 'settings') return enterSettings();
    if (NAV !== nav) { if (NAV) NAV.id = ''; enterHome({ r: 0, c: 0 }); }
  };
  play('notify');
  openDlg(`<span class="st-cap">STEAM PREGUNTA</span><h2>${esc((d.title || 'Steam').toUpperCase())}</h2>${d.text ? `<p>${esc(d.text)}</p>` : ''}
    <div class="slist">${d.buttons.map((b, i) => `<span class="txt-f sres" data-f data-i="${i}">${esc(b)}</span>`).join('')}</div>`, {
    onA: el => {
      const i = +el.dataset.i; play('select'); back();
      Sys.steamAnswer(i, d.buttons[i]).then(r => { if (!r.ok) toast(r.result === 'changed' ? 'Steam cambió la pregunta: aparecerá de nuevo' : 'Steam ya no lo pregunta', false); },
        () => toast('No se pudo responder a Steam', false));
      steamWatch(10000);
    },
    onB: () => { play('back'); swSkip = { key, until: Date.now() + 30000 }; back(); } });
  const dl = $('#dlg');
  NAV = mkNav([...dl.querySelectorAll('.slist [data-f]')].map(e => [e]), { place: (el, b) => ({ x: b.x, y: b.y + b.h + 4, w: b.w }) });
  NAV.id = 'dlg'; requestAnimationFrame(() => applyFocus());
  hints([['A', 'Responder'], ['B', 'Más tarde']]);
}

function quickReadings(m) { return m ? `GPU ${nv(m.gpu_temp_c, ' °C')} · uso ${nv(m.gpu_busy_pct, ' %')}` : 'leyendo…'; }

function quickA(el) {

/* Quick Menu: this game session only; stoned returns to the global profile when the game ends */
function nextSession(d, noWrap) {

/* Smoothness, measured on the console: STONE moves through Home by itself for a few seconds and

function measureSmoothness() {
  if (S.measuring) return;
  S.measuring = true;

  let last = performance.now(), run = true;
  const tick = t => { d.push(t - last); last = t; if (run) requestAnimationFrame(tick); };
  toast('Midiendo la fluidez: STONE se mueve sola unos segundos', false);
  enterHome({ r: 0, c: 0 });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
  const steps = ['right', 'right', 'right', 'left', 'left', 'left', 'right', 'right', 'left', 'left', 'right', 'left'];
  let k = 0;
  const iv = setInterval(() => {
    if (k < steps.length) { act(steps[k++]); return; }
    clearInterval(iv); run = false; S.measuring = false;
    const s = [...d].sort((a, b) => a - b), avg = d.reduce((a, b) => a + b, 0) / Math.max(1, d.length);
    S.smooth = { fps: Math.round(1000 / avg), p99: Math.round(s[Math.floor(s.length * .99)] || 0), slow: d.filter(x => x > 25).length, n: d.length, mode: S.render, res: drawRes() };
    console.info(`[stone] smoothness mode=${RENDER[S.render]} res=${S.smooth.res} fps=${S.smooth.fps} p99=${S.smooth.p99}ms slow=${S.smooth.slow}/${S.smooth.n}`);
    cat = CATS.indexOf('Pantalla'); enterSettings({ pane: true, ri });
    toast(`${RENDER[S.render]}: ${S.smooth.fps} cuadros por segundo de media; el más lento, ${S.smooth.p99} ms`, false);
  }, 450);
}

/* On-screen keyboard (Wi-Fi passwords, later names): the controller moves over the keys, A types,
   B deletes; LISTO returns the text, CANCELAR returns null. A physical keyboard also types. */
function osk(title, done, secret) {
  let text = '', shift = false, sym = false;
  const L1 = 'qwertyuiop', L2 = 'asdfghjklñ', L3 = 'zxcvbnm', N = '1234567890', SY = '!@#$%&*-_+=?/.,:;()[]';
  const draw = () => {
    const tr = s => shift ? s.toUpperCase() : s;
    const rows = sym ? [SY.slice(0, 10), SY.slice(10, 21), N] : [N, tr(L1), tr(L2), tr(L3)];
    const keys = rows.map(r => `<div class="krow">${[...r].map(c => `<span class="txt-f key" data-f data-k="${esc(c)}">${esc(c)}</span>`).join('')}</div>`).join('');
    const shown = secret ? '•'.repeat(Math.max(0, text.length - 1)) + text.slice(-1) : esc(text);
    openDlg(`<h2>${esc(title)}</h2><p class="okbox">${shown || '<span style="color:var(--slate)">escribe…</span>'}</p>${keys}
      <div class="krow"><span class="txt-f key wide" data-f data-k="⇧">${shift ? 'abc' : 'MAYÚS'}</span><span class="txt-f key wide" data-f data-k="#">${sym ? 'ABC' : '#+='}</span><span class="txt-f key wide" data-f data-k=" ">ESPACIO</span><span class="txt-f key wide" data-f data-k="⌫">BORRAR</span><span class="txt-f key wide" data-f data-k="✓">LISTO</span><span class="txt-f key wide" data-f data-k="✕">CANCELAR</span></div>`, {
      onA: el => { const k = el.dataset.k; play('select');
        if (k === '✓') { closeDlg(); return done(text); } if (k === '✕') { closeDlg(); return done(null); }
        if (k === '⌫') text = text.slice(0, -1); else if (k === '⇧') shift = !shift; else if (k === '#') sym = !sym; else if (text.length < 63) text += k;
        const at = [NAV.r, NAV.c]; draw(); NAV.r = Math.min(at[0], NAV.rows.length - 1); NAV.c = Math.min(at[1], NAV.rows[NAV.r].length - 1); applyFocus(); },
      onB: () => { play('back'); text = text.slice(0, -1); const at = [NAV.r, NAV.c]; draw(); NAV.r = at[0]; NAV.c = Math.min(at[1], NAV.rows[NAV.r].length - 1); applyFocus(); } });
    const d = $('#dlg');
    NAV = mkNav([...d.querySelectorAll('.krow')].map(r => [...r.querySelectorAll('[data-f]')]), { place: (el, b) => ({ x: b.x, y: b.y + b.h + 4, w: b.w }) });
    NAV.id = 'dlg'; requestAnimationFrame(() => applyFocus());
    hints([['A', 'Escribir'], ['B', 'Borrar']]);
  };
  draw();
}

/* ---------- BOOT ----------
   Plymouth already showed the line while the machine started; this is STONE Home arriving. The
   animation runs while the settings, the machine's capabilities and the library answer, so it adds
   no waiting of its own beyond BOOT_MIN_MS: Home appears as soon as it has what its first frame
   needs. The library is answered from Steam's files and the list kept from the last boot (the host
   does not wait for Steam, which starts after STONE Home); the system's versions (rpm-ostree, slow)
   are read behind, no screen needs them at the start. */
const BOOT_WORD_MS = 350, BOOT_MIN_MS = 650, BOOT_OUT_MS = 250, BOOT_MAX_MS = 5000;
async function boot() {
  S.screen = 'transition';
  $('#black').classList.add('on'); line.classList.add('boot');
  Sys.bootMark('visual').catch(() => {});          /* BOOT TO VISUAL: STONE Home's first frame */
  const first = Sys.firstrunStatus().catch(() => ({ done: true }));
  const prefs = Sys.prefsGet().then(loadPrefs).catch(() => {});
  Bridge.call('session.info').then(i => { if (!S.info) S.info = i; }).catch(() => {});
  Sys.info().then(i => { S.info = i; }).catch(() => {});
  const prep = Promise.all([prefs, refreshCaps(), prefs.then(loadLibrary)]);
  /* Home is about to be on screen: only now may stoned apply the saved profile (factory or validated) */
  const home = prep.then(() => PerfAPI.homeReady()).then(st => { adopt(st); return st; })
    .catch(e => { if (e && e.code === 'ServiceUnavailable') S.actual = { error: 'ServiceUnavailable' }; return null; });
  /* The frame before this one (Plymouth) is black with the full line at 82 % of the height and
     25 % of the width: STONE Home starts on that same frame. */
  setLine(720, 886, 480); line.classList.remove('off');
  play('start');
  await wait(BOOT_WORD_MS);
  $('#bootword').classList.add('on');
  await Promise.all([Promise.race([prep, wait(BOOT_MAX_MS)]), wait(BOOT_MIN_MS)]);
  $('#bootword').classList.remove('on');
  await wait(BOOT_OUT_MS);
  $('#black').classList.remove('on');
  S.section = 0; if (NAV) NAV.id = ''; NAV = null;
  const fr = await Promise.race([first, wait(3000).then(() => ({ done: true }))]);
  if (S.running !== null && S.game) { showGame(G[S.running], true); }
  else if (!fr.done) { await home; Sys.bootMark('ready').catch(() => {}); return firstRun(fr); }
  else enterHome({ r: 0, c: 0, slow: true });
  Sys.bootMark('ready').catch(() => {});           /* BOOT TO READY: Home answers the controller */
  setTimeout(() => line.classList.remove('boot'), 1300);
  armIdleOff();
  home.then(st => { if (st) setTimeout(() => bootNotices(st), 1400); });
  wantedArrived();
}
