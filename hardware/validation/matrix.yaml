# status: NOT TESTED | PASS | FAIL | BLOCKED. Only a run on the BC-250 can set PASS (D-08); a run
# records image (digest), date and result. "observed" lists earlier sightings that are NOT a pass.
# Validated by tests/test_hardware_profile.py.
